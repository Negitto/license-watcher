name: 鮫洲試験場 空き状況チェック

on:
  schedule:
    # 3分おきに実行 (UTC基準。cronの遅延で実際は数分ずれることがあります)
    - cron: '*/3 * * * *'
  workflow_dispatch: {} # 手動実行用ボタン

permissions:
  contents: write # 履歴ファイルをコミットするために必要

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存関係のインストール
        run: npm install

      - name: Playwrightブラウザのインストール
        run: npx playwright install --with-deps chromium

      - name: 空き状況チェック実行
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: npm run check

      - name: 履歴ファイルをコミット
        run: |
          git config user.name "license-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.csv
          git diff --staged --quiet || git commit -m "履歴を更新"
          git push
